# 每日一更：機構展覽來源 → Supabase events 表
# 來源：康文署開放數據、M+、Tai Kwun 大館、1a space
# 用同一組 Secrets：SUPABASE_URL、SUPABASE_SERVICE_ROLE_KEY
name: Scrape institution exhibitions

on:
  schedule:
    # 每日 UTC 22:10 = 香港 06:10
    - cron: "10 22 * * *"
  workflow_dispatch: {} # 仲可以喺 GitHub 手動撳 Run

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 康文署 LCSD
        run: node scripts/scrape-lcsd.mjs

      - name: M+
        if: always()
        run: node scripts/scrape-mplus.mjs

      - name: Tai Kwun 大館
        if: always()
        run: node scripts/scrape-taikwun.mjs

      - name: 1a space
        if: always()
        run: node scripts/scrape-1a.mjs
