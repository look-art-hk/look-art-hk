# 每日一更：抓 HK-AGA 會員畫廊現行展覽 → 寫入 Supabase events 表
# 需要先喺 GitHub repo 設定 Secrets:
#   SUPABASE_URL               https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  (service_role key，唔係 anon)
name: Scrape HK-AGA exhibitions

on:
  schedule:
    # 每日 UTC 22:00 = 香港 06:00
    - cron: "0 22 * * *"
  workflow_dispatch: {} # 仲可以喺 GitHub 手動撳 Run

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scrape & upsert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          Timeout=600 node scripts/scrape-hkaga.mjs

      - name: Notify failure
        if: failure()
        run: echo "scrape 失敗，睇上面 log"
